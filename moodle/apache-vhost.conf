# Apache site for Moodle 5.1 and newer. Baked into the moodle image as the
# default site, replacing the base image's 000-default.conf.
#
# Since Moodle 5.1 the code is split into two levels:
#   /var/www/html/          project root: config.php, vendor/, admin/cli/, ...
#   /var/www/html/public/   the only folder browsers can reach (the webroot)
# so config.php, which holds your database password, is never web-reachable.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Moodle's router: URLs that don't match a real file (newer Moodle pages,
    # the REST API under /api/) are handled by public/r.php. config.php sets
    # $CFG->routerconfigured = true to tell Moodle this is in place.
    FallbackResource /r.php

    # Developer notes, database schemas and test fixtures ship inside
    # public/ but are not meant for browsers, and some reveal the exact
    # Moodle version. Moodle's own "Public paths" check (Site administration
    # > Reports > Security checks) expects them to return 404. Paths after a
    # ".php/" are skipped, so an uploaded file that happens to be called
    # README.txt still downloads through pluginfile.php.
    RedirectMatch 404 "(?i)^(?!.*\.php/).*/(readme[^/]*|upgrade|upgrading(-current)?)\.(txt|md)$"
    RedirectMatch 404 "^(?!.*\.php/).*/(environment\.xml|db/install\.xml|composer\.(json|lock)|phpunit\.xml(\.dist)?)$"
    RedirectMatch 404 "^(?!.*\.php/).*/tests/(fixtures|behat)/"
    RedirectMatch 404 "^(?!.*\.php/).*/\.(?!well-known/)"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

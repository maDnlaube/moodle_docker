; PHP settings for Moodle, layered on top of the moodlehq base image defaults.
; Loaded last (zz- prefix) so these values win.

; --- Requests and uploads ---------------------------------------------------
; Upload limits — keep in sync with `request_body max_size` in caddy/Caddyfile.
upload_max_filesize = 200M
post_max_size = 210M

; Moodle requires at least 5000.
max_input_vars = 5000

; A per-request ceiling, not a reservation: ordinary pages use a fraction of
; it, but course backups/restores and large reports can need several hundred
; MB and fail with "Allowed memory size exhausted" below this.
memory_limit = 512M
max_execution_time = 300

; --- Opcache (keeps compiled PHP in memory) ----------------------------------
; Moodle 5.3 ships tens of thousands of PHP files. PHP's defaults (128 MB,
; 10000 files) fill up and start evicting, which makes pages slower.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code is baked into the image and never changes while the container
; runs, so checking files for changes once a minute is plenty.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; Moodle reads PHP doc comments at runtime; they must be kept.
opcache.save_comments = 1

; PHP's just-in-time compiler. Its buffer is shared memory reserved once for
; the whole web server, not per request. Set opcache.jit = disable to turn it
; off if you ever suspect it of causing crashes.
opcache.jit = tracing
opcache.jit_buffer_size = 100M

; --- Filesystem lookups ------------------------------------------------------
realpath_cache_size = 8M
realpath_cache_ttl = 600

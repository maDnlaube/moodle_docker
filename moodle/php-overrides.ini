; PHP settings for Moodle, layered on top of the moodlehq base image defaults.
; Loaded last (zz- prefix) so these values win.

; Upload limits — keep in sync with `request_body max_size` in caddy/Caddyfile.
upload_max_filesize = 200M
post_max_size = 210M

; Moodle requires at least 5000.
max_input_vars = 5000

memory_limit = 256M
max_execution_time = 300
